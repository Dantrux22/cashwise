<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="refresh" content="0; url=public/finflow-app.html">
<title>CashWise</title>
<script>
// Esta página quedó abandonada de un refactor viejo — tenía su propia copia
// del código (sin ninguno de los fixes de sync/tombstones) que leía y escribía
// la MISMA base de datos que la app real, causando que gastos recurrentes
// borrados en public/finflow-app.html reaparecieran al abrir este link viejo.
// Ahora solo redirige a la app real y se asegura de borrar el Service Worker
// que esta página vieja pudo haber registrado en el pasado.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
}
location.replace('public/finflow-app.html');
</script>
</head>
<body>
<p>Redirigiendo a <a href="public/finflow-app.html">CashWise</a>…</p>
</body>
</html>
